name: Data source request
description: Suggest a Swiss public data source to roll up
labels: [data-source]
body:
  - type: input
    id: source
    attributes:
      label: Source
      description: Name and publisher, e.g. "ASTRA traffic counting stations (Federal Roads Office)"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: API or dataset URL
      description: The public, documented endpoint or opendata.swiss / geo.admin.ch entry
    validations:
      required: true
  - type: input
    id: licence
    attributes:
      label: Licence or terms of use
      description: As stated by the publisher (e.g. "opendata.swiss terms_by", "CC BY 4.0"). Leave blank if unknown.
  - type: textarea
    id: questions
    attributes:
      label: Questions it would answer
      description: Two or three example questions an agent could answer with it
    validations:
      required: true
  - type: checkboxes
    id: access
    attributes:
      label: Access
      options:
        - label: Public, no login needed
        - label: Needs a free API key
