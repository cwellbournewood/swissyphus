name: Live canary

# Nightly run against the ~25 live Swiss upstream sources. Upstream APIs drift
# (formats change, endpoints move, hosts go down), and the offline suites
# can't see that. This workflow does.
#
# Each check runs with continue-on-error so that one failure doesn't hide the
# others. The final step then:
#   - on any failure: opens a single issue labelled `live-canary`, or comments
#     on it if it is already open, and marks the run as failed
#   - on a fully green run: comments and closes that issue if it is open
#
# This is informational. It must NOT be a required status check, because
# upstream flakiness is expected.

on:
  schedule:
    - cron: "17 4 * * *" # daily 04:17 UTC (off the top of the hour, to avoid the cron rush)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Source health (swissyphus doctor)
        id: doctor
        continue-on-error: true
        shell: bash # -eo pipefail, so a failure inside the tee pipeline is kept
        run: |
          node dist/index.js doctor 2>&1 | tee doctor.log

      - name: MCP smoke test (test/smoke.mjs)
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          node test/smoke.mjs 2>&1 | tee smoke.log

      - name: REST + remote MCP test (test/rest.mjs)
        id: rest
        continue-on-error: true
        shell: bash
        run: |
          node test/rest.mjs 2>&1 | tee rest.log

      - name: Step summary
        if: always()
        shell: bash
        env:
          DOCTOR: ${{ steps.doctor.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          REST: ${{ steps.rest.outcome }}
        run: |
          icon() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }
          {
            echo "## Live canary"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| \`swissyphus doctor\` | $(icon "$DOCTOR") $DOCTOR |"
            echo "| \`test/smoke.mjs\` | $(icon "$SMOKE") $SMOKE |"
            echo "| \`test/rest.mjs\` | $(icon "$REST") $REST |"
            for f in doctor smoke rest; do
              [ -f "$f.log" ] || continue
              echo
              echo "<details><summary>$f.log (failures and summary)</summary>"
              echo
              echo '```'
              grep -E 'FAIL|✗|DOWN|down|error|passed|healthy' "$f.log" | head -n 80 || true
              echo '```'
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-canary-logs
          path: "*.log"
          retention-days: 14
          if-no-files-found: ignore

      - name: Open / update / close the live-canary issue
        if: always()
        uses: actions/github-script@v7
        env:
          DOCTOR: ${{ steps.doctor.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          REST: ${{ steps.rest.outcome }}
        with:
          script: |
            const fs = require("fs");
            const LABEL = "live-canary";
            const outcomes = {
              "swissyphus doctor": process.env.DOCTOR,
              "test/smoke.mjs": process.env.SMOKE,
              "test/rest.mjs": process.env.REST,
            };
            // Anything other than "success" counts as a failure, including
            // "skipped" (e.g. because the build step failed).
            const failed = Object.entries(outcomes).filter(([, o]) => o !== "success");
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;

            const excerpt = (file) => {
              try {
                const lines = fs.readFileSync(file, "utf8").split("\n")
                  .filter((l) => /FAIL|✗|DOWN|down|error|passed|healthy/.test(l));
                return lines.slice(0, 40).join("\n").slice(0, 3000);
              } catch { return ""; }
            };

            // Only the default branch owns the tracking issue. A manual run on a
            // feature branch (workflow_dispatch, to verify a fix against the live
            // upstreams) reports via the run status and logs only.
            const defaultRef = `refs/heads/${context.payload.repository?.default_branch ?? "main"}`;
            if (context.ref !== defaultRef) {
              core.info(`Run on ${context.ref}, not ${defaultRef}: leaving the live-canary issue alone.`);
              if (failed.length) core.setFailed(`Live canary failed: ${failed.map(([k]) => k).join(", ")}`);
              return;
            }

            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: LABEL, per_page: 10,
            });
            const issue = open[0];

            if (failed.length === 0) {
              if (issue) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `✅ Live canary is green again: ${runUrl}. Closing.`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number, state: "closed", state_reason: "completed",
                });
                core.info(`Closed #${issue.number}`);
              }
              return;
            }

            const table = Object.entries(outcomes)
              .map(([k, o]) => `| \`${k}\` | ${o === "success" ? "✅" : "❌"} ${o} |`).join("\n");
            const logs = ["doctor", "smoke", "rest"]
              .map((f) => [f, excerpt(`${f}.log`)])
              .filter(([, t]) => t)
              .map(([f, t]) => `<details><summary>${f}.log</summary>\n\n\`\`\`\n${t}\n\`\`\`\n</details>`)
              .join("\n");
            const body = `❌ Live canary failed on ${new Date().toISOString().slice(0, 10)}: ${runUrl}\n\n| Check | Result |\n|---|---|\n${table}\n\n${logs}\n\nFull logs are in the run's \`live-canary-logs\` artifact.`;

            if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
              core.info(`Commented on #${issue.number}`);
            } else {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: LABEL });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({
                  owner, repo, name: LABEL, color: "d93f0b",
                  description: "Nightly live-upstream canary failure (opened/closed automatically)",
                });
              }
              const { data: created } = await github.rest.issues.create({
                owner, repo, labels: [LABEL],
                title: "Live canary failing: upstream drift or outage",
                body: `${body}\n\n---\nThis issue is managed by \`.github/workflows/live-canary.yml\`. Later failures are added as comments, and the issue closes itself after the next fully green run.`,
              });
              core.info(`Opened #${created.number}`);
            }
            core.setFailed(`Live canary failed: ${failed.map(([k]) => k).join(", ")}`);
