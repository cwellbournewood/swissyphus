name: Usage stats

# Records npm downloads, .mcpb release downloads, stars/forks and (with STATS_TOKEN)
# GitHub traffic once a day, on the `stats` branch. Summary: README.md on that branch.
#
# GitHub keeps traffic for 14 days only; this job turns it into a history. Traffic needs
# a token GITHUB_TOKEN cannot provide: create a fine-grained personal access token for this
# repository with "Administration: Read-only" and save it as the repo secret STATS_TOKEN.
# Without it, traffic is skipped and everything else is still collected.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write # push to the stats branch

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: main

      - name: Check out the stats branch (created on the first run)
        run: |
          git clone --quiet "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" stats
          cd stats
          if git ls-remote --exit-code --heads origin stats >/dev/null; then
            git checkout --quiet stats
          else
            git checkout --quiet --orphan stats
            git rm -rf --quiet . || true
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: Collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          node main/.github/stats/collect.mjs stats
          cat stats/README.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        run: |
          cd stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No change."; exit 0; }
          git commit --quiet -m "Stats $(date -u +%F)"
          git push --quiet origin stats
